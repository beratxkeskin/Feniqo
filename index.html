<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>MoneyMate | Kişisel Finans Takip ve Analiz Platformu</title>
    <meta name="description" content="Gelir, gider, bütçe ve harcama alışkanlıklarınızı modern ve responsive gösterge paneli üzerinden kolayca takip edin. Kişisel finans koçunuz MoneyMate." />
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MoneyMate" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Theme and Color Theme Synchronous Initialization -->
    <script>
      (function() {
        const colorTheme = localStorage.getItem('moneymate_color_theme') || 'emerald';
        document.documentElement.classList.add('theme-' + colorTheme);
        const appliedTheme = localStorage.getItem('moneymate_applied_theme');
        if (appliedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
